# The commit-time layer. Fires for agent commits identically to human ones —
# a commit containing a token physically fails, whoever made it.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --no-banner --redact
    token-literal:
      # ADDED lines only. `git diff -G` matches added *or removed* lines, which
      # made it impossible to ever commit a change that REMOVES a leaked token —
      # exactly the commit you most need to be able to make.
      run: |
        if git diff --staged -U0 --no-color | grep -E '^\+' | grep -vE '^\+\+\+' \
             | grep -qE '(pk|sk)\.ey[A-Za-z0-9._-]{20,}'; then
          echo "✗ Mapbox token literal found in ADDED lines. Read docs/SECRETS.md."
          exit 1
        fi
