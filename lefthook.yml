# The commit-time layer. Fires for agent commits identically to human ones —
# a commit containing a token physically fails, whoever made it.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --no-banner --redact
    token-literal:
      run: |
        if git diff --staged -G'(pk|sk)\.ey[A-Za-z0-9._-]{20,}' --name-only | grep -q .; then
          echo "✗ Mapbox token literal found in staged changes. Read docs/SECRETS.md."
          exit 1
        fi
